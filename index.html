<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소설 창작 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;color:#1a1a18;overflow:hidden}
:root{
  --bg:#f7f6f2;--cp:#fff;--cs:#f2f1ed;--ct:#eae9e4;
  --ci:#e6f1fb;--csu:#eaf3de;--cw:#faeeda;--cd:#fcebeb;
  --tp:#1a1a18;--ts:#5c5b57;--tt:#999895;
  --ti:#0b4079;--tsu:#254a08;--tw:#6b3e00;--td:#731e1e;
  --bt:rgba(26,26,24,.1);--bs:rgba(26,26,24,.2);
  --bi:#1660a8;--bw:#854f0b;--bd2:#a32d2d;
  --r:7px;--rl:11px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#131311;--cp:#1e1e1c;--cs:#252523;--ct:#2e2e2b;
  --ci:#0a1e33;--csu:#0d2004;--cw:#1e1000;--cd:#200808;
  --tp:#e5e3dd;--ts:#a5a39d;--tt:#68665f;
  --ti:#85b7eb;--tsu:#97c459;--tw:#ef9f27;--td:#f09595;
  --bt:rgba(229,227,221,.1);--bs:rgba(229,227,221,.2);
  --bi:#378add;--bw:#ef9f27;--bd2:#e24b4a;
}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scaleY(.35);opacity:.25}50%{transform:scaleY(1.2);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app{height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#file-input{position:fixed;top:-9999px;left:-9999px;opacity:0}
.hov:hover{background:var(--cs)!important}
.hov-card:hover{border-color:var(--bs)!important}
.num-chip:hover{background:var(--ci)!important;border-color:var(--bi)!important}
button{font-family:inherit}
button:not(:disabled):active{transform:scale(.97)}
#body-editor{
  flex:1;padding:13px 14px;font-size:14px;line-height:2.05;
  font-family:Georgia,"Nanum Myeongjo",serif;
  color:var(--tp);outline:none;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;
  border:.5px solid var(--bt);border-radius:var(--r);
  background:transparent;cursor:text;
}
#body-editor:focus{border-color:var(--bs)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--bt);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--bs)}
</style>
</head>
<body>
<input type="file" id="file-input" accept=".html,.htm">
<div id="app"></div>
<script>
'use strict';
const BD='.5px solid var(--bt)',R='var(--r)',RL='var(--rl)',WK='nv-tts-v1';
const stG=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}};
const stS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const stD=k=>{try{localStorage.removeItem(k)}catch{}};

let S={
  page:'main',works:[],work:null,
  partId:null,epId:null,body:'',dirty:false,
  playing:false,uploading:false,upErr:'',
  stUrl:'http://localhost:8000',stVoice:'F1',stShowCfg:false,
  ttsStatus:'idle' // idle | loading | playing | error
};
let editorEl=null;
let _audioEl=null;
const g=id=>document.getElementById(id);
const set=u=>{Object.assign(S,u);render()};

/* ── Storage helpers ─────────────────────────────────── */
function getBodyText(){
  if(!editorEl)return S.body;
  return editorEl.innerText||'';
}
function saveBodyNow(){
  const body=getBodyText();
  const w=JSON.parse(JSON.stringify(S.work));
  const pt=w.parts.find(p=>p.id===S.partId);
  if(pt&&S.epId){const ep=pt.eps.find(e=>e.id===S.epId);if(ep)ep.body=body}
  stS('nv-w-'+w.id,w);S.work=w;S.body=body;S.dirty=false;
  return w;
}

/* ── Supertonic 3 TTS ────────────────────────────────── */
function stopSp(rr=true){
  if(_audioEl){_audioEl.pause();_audioEl.src='';_audioEl=null}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  if(rr)set({playing:false,ttsStatus:'idle'});
  else{S.playing=false;S.ttsStatus='idle'}
}

async function togSp(){
  if(S.playing){stopSp();return}
  const txt=getBodyText();if(!txt.trim())return;
  set({playing:true,ttsStatus:'loading'});
  try{
    const resp=await fetch(S.stUrl+'/v1/audio/speech',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'supertonic-3',
        input:txt,
        voice:S.stVoice,
        response_format:'mp3',
        speed:1.0,
        lang:'ko'
      })
    });
    if(!resp.ok)throw new Error('서버 응답 오류 '+resp.status);
    const blob=await resp.blob();
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    _audioEl=audio;
    audio.oncanplay=()=>set({ttsStatus:'playing'});
    audio.onended=()=>{URL.revokeObjectURL(url);_audioEl=null;set({playing:false,ttsStatus:'idle'})};
    audio.onerror=()=>{URL.revokeObjectURL(url);_audioEl=null;set({playing:false,ttsStatus:'error'})};
    audio.play();
  }catch(e){
    // Supertonic 미연결 → 브라우저 TTS 대체
    set({ttsStatus:'browser'});
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(txt);
      const vs=window.speechSynthesis.getVoices();
      const kr=vs.find(v=>v.lang==='ko-KR')||vs.find(v=>v.lang.startsWith('ko'));
      if(kr)u.voice=kr;u.lang='ko-KR';u.rate=0.92;
      u.onend=()=>set({playing:false,ttsStatus:'idle'});
      u.onerror=()=>set({playing:false,ttsStatus:'idle'});
      window.speechSynthesis.speak(u);
      set({playing:true,ttsStatus:'playing'});
    }else{
      set({playing:false,ttsStatus:'idle'});
    }
  }
}

/* ── 웹소설 양식 ─────────────────────────────────────── */
function applyWebnovelFormat(text){
  if(!text)return text;
  var t=text;
  t=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  t=t.replace(/[ \t]+$/gm,'').replace(/^[ \t]+/gm,'');
  t=t.replace(/([.!?\u2026]+)(?=[^\n"'\u201d\u2019])/g,'$1\n');
  var lines=t.split('\n').map(function(l){return l.trim()});
  var out=[];
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(!ln){out.push('');continue;}
    if(/^[.\u2026]+$/.test(ln)){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);out.push('');continue;
    }
    if(ln.length<=10&&/^[가-힣a-zA-Z]+[,!]$/.test(ln)){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);out.push('');continue;
    }
    if(ln.startsWith('[')){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);
      while(i+1<lines.length&&lines[i+1]&&!lines[i+1].includes(']')){i++;out.push(lines[i]);}
      if(i+1<lines.length&&lines[i+1]&&lines[i+1].includes(']')){i++;out.push(lines[i]);}
      out.push('');continue;
    }
    var isDlg=ln[0]==='"'||ln[0]==='\u201c';
    if(isDlg){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);out.push('');continue;
    }
    var isMono=ln[0]==='\''||ln[0]==='\u2018';
    if(isMono){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);out.push('');continue;
    }
    var isParallel=ln.endsWith(',')&&ln.length<25;
    if(isParallel){
      if(out.length&&out[out.length-1]!=='')out.push('');
      out.push(ln);
      while(i+1<lines.length&&lines[i+1]){
        var nxt=lines[i+1];
        if((nxt.endsWith(',')&&nxt.length<25)||nxt.length<20){out.push(nxt);i++;}
        else break;
      }
      out.push('');continue;
    }
    var lastOut=out.length?out[out.length-1]:'';
    if(lastOut&&lastOut!==''&&(lastOut.endsWith('.')||lastOut.endsWith('!')||lastOut.endsWith('?')||lastOut.endsWith('\u2026'))){
      out.push('');
    }
    out.push(ln);
  }
  t=out.join('\n').replace(/\n{3,}/g,'\n\n');
  return t.trim();
}

/* ── DOM helpers ─────────────────────────────────────── */
function mk(tag,o={}){
  const d=document.createElement(tag);
  o.style&&Object.assign(d.style,o.style);
  o.onclick&&(d.onclick=o.onclick);
  o.className&&(d.className=o.className);
  o.id&&(d.id=o.id);
  o.textContent!==undefined&&(d.textContent=o.textContent);
  o.innerHTML!==undefined&&(d.innerHTML=o.innerHTML);
  o.disabled!==undefined&&(d.disabled=o.disabled);
  return d;
}
const spnr=()=>`<i class="ti ti-loader" style="animation:spin 1s linear infinite;display:inline-block;font-size:12px;vertical-align:-2px"></i>`;
const lbl=t=>mk('div',{textContent:t,style:{padding:'8px 10px',borderBottom:BD,fontSize:'9px',fontWeight:'600',color:'var(--tt)',letterSpacing:'.08em',textTransform:'uppercase',flexShrink:'0'}});
function mkBtn(html,cb,o={}){
  const b=mk('button');b.innerHTML=html;b.onclick=cb;
  o.disabled!==undefined&&(b.disabled=o.disabled);
  o.id&&(b.id=o.id);
  Object.assign(b.style,{display:'inline-flex',alignItems:'center',gap:'4px',padding:'5px 11px',fontSize:'11px',border:BD,borderRadius:R,cursor:'pointer',background:'var(--cp)',color:'var(--ts)',...(o.style||{})});
  if(o.disabled)Object.assign(b.style,{opacity:'.4',cursor:'default'});
  return b;
}

/* ── Dialogs ─────────────────────────────────────────── */
function showConfirm(msg,onOk){
  const ov=mk('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.35)',zIndex:'9999',display:'flex',alignItems:'center',justifyContent:'center'}});
  const box=mk('div',{style:{background:'var(--cp)',borderRadius:RL,padding:'20px 22px',maxWidth:'300px',width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,.18)'}});
  box.appendChild(mk('div',{textContent:msg,style:{fontSize:'13px',color:'var(--tp)',marginBottom:'16px',lineHeight:'1.55'}}));
  const btns=mk('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
  const ca=mk('button');ca.textContent='취소';ca.onclick=()=>document.body.removeChild(ov);Object.assign(ca.style,{padding:'6px 14px',fontSize:'12px',border:BD,borderRadius:R,cursor:'pointer',background:'var(--cs)',color:'var(--ts)'});
  const ok=mk('button');ok.textContent='삭제';ok.onclick=()=>{document.body.removeChild(ov);onOk()};Object.assign(ok.style,{padding:'6px 14px',fontSize:'12px',border:'none',borderRadius:R,cursor:'pointer',background:'#c0392b',color:'#fff',fontWeight:'500'});
  btns.append(ca,ok);box.appendChild(btns);ov.appendChild(box);ov.onclick=e=>{if(e.target===ov)document.body.removeChild(ov)};document.body.appendChild(ov);
}
function showPrompt(msg,def,onOk){
  const ov=mk('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.35)',zIndex:'9999',display:'flex',alignItems:'center',justifyContent:'center'}});
  const box=mk('div',{style:{background:'var(--cp)',borderRadius:RL,padding:'20px 22px',maxWidth:'320px',width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,.18)'}});
  box.appendChild(mk('div',{textContent:msg,style:{fontSize:'13px',color:'var(--tp)',marginBottom:'10px'}}));
  const inp=document.createElement('input');inp.type='text';inp.value=def||'';Object.assign(inp.style,{width:'100%',padding:'8px 10px',fontSize:'13px',border:BD,borderRadius:R,marginBottom:'14px',color:'var(--tp)',background:'var(--cs)',boxSizing:'border-box'});box.appendChild(inp);
  const btns=mk('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
  const ca=mk('button');ca.textContent='취소';ca.onclick=()=>document.body.removeChild(ov);Object.assign(ca.style,{padding:'6px 14px',fontSize:'12px',border:BD,borderRadius:R,cursor:'pointer',background:'var(--cs)',color:'var(--ts)'});
  const ok=mk('button');ok.textContent='확인';ok.onclick=()=>{const v=inp.value.trim();if(v){document.body.removeChild(ov);onOk(v)}};Object.assign(ok.style,{padding:'6px 14px',fontSize:'12px',border:'none',borderRadius:R,cursor:'pointer',background:'var(--tp)',color:'var(--cp)',fontWeight:'500'});
  btns.append(ca,ok);box.appendChild(btns);ov.appendChild(box);ov.onclick=e=>{if(e.target===ov)document.body.removeChild(ov)};document.body.appendChild(ov);
  setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter'){const v=inp.value.trim();if(v){document.body.removeChild(ov);onOk(v)}}if(e.key==='Escape')document.body.removeChild(ov)};
}

/* ── HTML 파일 업로드 ────────────────────────────────── */
const fileInput=g('file-input');
fileInput.addEventListener('change',e=>{
  const f=e.target.files?.[0];if(!f)return;
  set({uploading:true,upErr:''});
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const p=parseHTML(ev.target.result);
      if(!p.parts.length||!p.parts.some(x=>x.eps.length)){set({uploading:false,upErr:'파트·화 구조를 찾을 수 없습니다.'});return}
      const id='w'+Date.now();
      const work={id,title:p.title,genre:p.genre||'',description:p.description||'',createdAt:new Date().toLocaleDateString('ko-KR'),parts:p.parts};
      const meta={id,title:work.title,genre:work.genre,description:work.description,createdAt:work.createdAt,partCount:work.parts.length,epCount:p.totalEps||0};
      const ws=[...S.works,meta];stS(WK,ws);stS('nv-w-'+id,work);
      set({uploading:false,works:ws,page:'editor',work,partId:work.parts[0]?.id||null,epId:null,body:'',dirty:false,upErr:''});
    }catch(err){set({uploading:false,upErr:'파일 오류: '+err.message})}
  };
  rd.onerror=()=>set({uploading:false,upErr:'읽기 실패'});
  rd.readAsText(f,'utf-8');fileInput.value='';
});
function parseHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,nav,footer,header').forEach(e=>e.remove());
  let title=(doc.querySelector('h1')?.textContent||doc.querySelector('title')?.textContent||'').trim();
  const raw=(doc.body?.innerText||doc.body?.textContent||html).replace(/\r\n|\r/g,'\n');
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const parts=[];let cp=null,ce=null,pid=1,buf=[];
  const fE=()=>{if(ce&&cp){if(buf.length)ce.synopsis=(ce.synopsis+' '+buf.join(' ')).trim();cp.eps.push(ce);ce=null;buf=[]}};
  const fP=()=>{fE();if(cp){if(cp.eps.length){cp.startEp=cp.eps[0].id;cp.endEp=cp.eps[cp.eps.length-1].id}parts.push(cp);cp=null}};
  const rP=/^(\d+)\s*부\s*[.·:—\-]?\s*(.*)/,rE=/^(\d+)\s*화\s*[.·:—\-]?\s*(.*)/;
  for(const ln of lines){
    const mP=ln.match(rP),mE=ln.match(rE);
    if(mP){fP();cp={id:pid++,title:`${mP[1]}부${mP[2].trim()?'. '+mP[2].trim():''}`,startEp:null,endEp:null,eps:[],status:'done'}}
    else if(mE){fE();if(!cp)cp={id:pid++,title:'1부',startEp:null,endEp:null,eps:[],status:'done'};ce={id:parseInt(mE[1]),title:`${mE[1]}화`,synopsis:mE[2].trim(),body:''};buf=[]}
    else if(ce){if(ln.length>4&&!/^\d+$/.test(ln))buf.push(ln)}
    else if(!title&&ln.length<60&&!/^\d/.test(ln)&&!cp&&!parts.length)title=ln;
  }
  fP();if(!title)title='가져온 작품';
  if(!parts.length){const all=[];for(const ln of lines){const m=ln.match(rE);if(m)all.push({id:parseInt(m[1]),title:`${m[1]}화`,synopsis:m[2].trim(),body:''})}
    if(all.length){const sz=Math.ceil(all.length/Math.ceil(all.length/25));let p2=1;for(let i=0;i<all.length;i+=sz){const ch=all.slice(i,i+sz);parts.push({id:p2,title:`${p2}부`,startEp:ch[0].id,endEp:ch[ch.length-1].id,eps:ch,status:'done'});p2++}}}
  return{title,genre:'',description:'',parts,totalEps:parts.reduce((s,p)=>s+p.eps.length,0)};
}

/* ── Work management ─────────────────────────────────── */
function openWork(id){const w=stG('nv-w-'+id);if(w)set({page:'editor',work:w,partId:w.parts[0]?.id||null,epId:null,body:'',dirty:false,playing:false,ttsStatus:'idle'})}
function delWork(id,e){e.stopPropagation();showConfirm('이 작품을 삭제할까요?',()=>{stD('nv-w-'+id);const ws=S.works.filter(w=>w.id!==id);stS(WK,ws);set({works:ws})})}
function createBlank(){
  const id='w'+Date.now();
  const work={id,title:'새 작품',genre:'',description:'',createdAt:new Date().toLocaleDateString('ko-KR'),parts:[]};
  const meta={id,title:work.title,genre:'',description:'',createdAt:work.createdAt,partCount:0,epCount:0};
  const ws=[...S.works,meta];stS(WK,ws);stS('nv-w-'+id,work);
  set({works:ws,page:'editor',work,partId:null,epId:null,body:'',dirty:false});
}
function editTitle(){showPrompt('작품 제목',S.work.title,t=>{const w=JSON.parse(JSON.stringify(S.work));w.title=t;stS('nv-w-'+w.id,w);const ws=S.works.map(m=>m.id===w.id?{...m,title:t}:m);stS(WK,ws);set({work:w,works:ws})})}
function editGenre(){showPrompt('장르',S.work.genre||'',g=>{const w=JSON.parse(JSON.stringify(S.work));w.genre=g;stS('nv-w-'+w.id,w);const ws=S.works.map(m=>m.id===w.id?{...m,genre:g}:m);stS(WK,ws);set({work:w,works:ws})})}

/* ── Parts & Episodes ────────────────────────────────── */
function addPart(){showPrompt('새 파트 이름',`${(Math.max(0,...S.work.parts.map(p=>p.id))+1)}부`,title=>{const w=JSON.parse(JSON.stringify(S.work));const newId=Math.max(0,...w.parts.map(p=>p.id))+1;w.parts.push({id:newId,title,startEp:null,endEp:null,eps:[],status:'done'});stS('nv-w-'+w.id,w);set({work:w,partId:newId,epId:null,body:'',dirty:false})})}
function delPart(id){const pt=S.work.parts.find(p=>p.id===id);showConfirm(`"${pt?.title||'이 파트'}"를 삭제할까요?`,()=>{const w=JSON.parse(JSON.stringify(S.work));const idx=w.parts.findIndex(p=>p.id===id);if(idx<0)return;w.parts.splice(idx,1);stS('nv-w-'+w.id,w);set({work:w,partId:w.parts[0]?.id||null,epId:null,body:'',dirty:false})})}
function addEp(){if(!S.partId)return;const w=JSON.parse(JSON.stringify(S.work));const pt=w.parts.find(p=>p.id===S.partId);if(!pt)return;const allIds=w.parts.flatMap(p=>p.eps.map(e=>e.id));const newId=allIds.length?Math.max(...allIds)+1:1;pt.eps.push({id:newId,title:`${newId}화`,synopsis:'',body:''});pt.startEp=pt.eps[0].id;pt.endEp=pt.eps[pt.eps.length-1].id;pt.status='done';stS('nv-w-'+w.id,w);set({work:w,epId:newId,body:'',dirty:false})}
function delEp(epId){const ep=S.work.parts.find(p=>p.id===S.partId)?.eps.find(e=>e.id===epId);showConfirm(`"${ep?.title||'이 화'}"를 삭제할까요?`,()=>{const w=JSON.parse(JSON.stringify(S.work));const pt=w.parts.find(p=>p.id===S.partId);if(!pt)return;const idx=pt.eps.findIndex(e=>e.id===epId);if(idx<0)return;pt.eps.splice(idx,1);if(pt.eps.length){pt.startEp=pt.eps[0].id;pt.endEp=pt.eps[pt.eps.length-1].id}else{pt.startEp=null;pt.endEp=null}stS('nv-w-'+w.id,w);const nEid=pt.eps[0]?.id||null;set({work:w,epId:nEid,body:nEid?pt.eps.find(e=>e.id===nEid)?.body||'':'',dirty:false})})}

function autoSave(){
  if(!S.epId||!S.work)return;
  const body=getBodyText();
  const w=JSON.parse(JSON.stringify(S.work));
  const pt=w.parts.find(p=>p.id===S.partId);
  if(pt){const ep=pt.eps.find(e=>e.id===S.epId);if(ep)ep.body=body}
  stS('nv-w-'+w.id,w);S.work=w;S.body=body;S.dirty=false;
}
function selPt(id){stopSp(false);autoSave();const pt=S.work.parts.find(p=>p.id===id);set({partId:id,epId:null,body:'',dirty:false})}
function selEp(id){stopSp(false);autoSave();const ep=S.work.parts.find(p=>p.id===S.partId)?.eps.find(e=>e.id===id);set({epId:id,body:ep?.body||'',dirty:false})}
function doSave(){
  const body=getBodyText();if(!body||!S.epId)return;
  const w=JSON.parse(JSON.stringify(S.work));
  const pt=w.parts.find(p=>p.id===S.partId);
  if(pt){const ep=pt.eps.find(e=>e.id===S.epId);if(ep)ep.body=body}
  stS('nv-w-'+w.id,w);set({work:w,body,dirty:false});
}
function doFormat(){
  const body=getBodyText();if(!body)return;
  const f=applyWebnovelFormat(body);
  S.body=f;S.dirty=true;
  if(editorEl)editorEl.innerText=f;
  const cc=g('cc');if(cc)cc.textContent=f.length.toLocaleString()+'자';
}

/* ── Numbers ─────────────────────────────────────────── */
function bldNums(c){
  c.innerHTML='';
  const body=getBodyText();
  const ns=[];let m;const rg=/\d+/g;
  while((m=rg.exec(body))!==null)ns.push({v:m[0],s:m.index,e:m.index+m[0].length});
  if(!ns.length){c.appendChild(mk('div',{textContent:'숫자 없음',style:{fontSize:'10px',color:'var(--tt)',textAlign:'center',padding:'18px 0'}}));return}
  ns.forEach(n=>{
    const chip=mk('div',{className:'num-chip',style:{display:'flex',flexDirection:'column',marginBottom:'4px',padding:'5px 7px',borderRadius:R,border:BD,background:'var(--cp)',cursor:'default',transition:'all .12s'}});
    chip.appendChild(mk('span',{textContent:n.v,style:{fontSize:'14px',fontWeight:'600',color:'var(--tp)'}}));
    const cx=mk('div',{style:{fontSize:'10px',color:'var(--tt)',lineHeight:'1.4',overflow:'hidden',display:'-webkit-box',WebkitLineClamp:'2',WebkitBoxOrient:'vertical'}});
    cx.textContent=(n.s>10?'…':'')+body.slice(Math.max(0,n.s-10),Math.min(body.length,n.e+12))+(n.e+12<body.length?'…':'');
    chip.appendChild(cx);c.appendChild(chip);
  });
}

      const urlInp=document.createElement('input');urlInp.type='text';urlInp.value=S.stUrl;urlInp.oninput=e=>S.stUrl=e.target.value;Object.assign(urlInp.style,{width:'100%',padding:'6px 9px',fontSize:'12px',border:BD,borderRadius:R,color:'var(--tp)',background:'var(--cs)',marginBottom:'10px',boxSizing:'border-box'});pop.appendChild(urlInp);
      pop.appendChild(mk('div',{textContent:'목소리',style:{fontSize:'10px',fontWeight:'600',color:'var(--ts)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}));
      const voices=[{id:'F1',label:'여성 F1'},{id:'F2',label:'여성 F2'},{id:'F3',label:'여성 F3'},{id:'F4',label:'여성 F4'},{id:'F5',label:'여성 F5'},{id:'M1',label:'남성 M1'},{id:'M2',label:'남성 M2'},{id:'M3',label:'남성 M3'},{id:'M4',label:'남성 M4'},{id:'M5',label:'남성 M5'}];
      const vRow=mk('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'12px'}});
      voices.forEach(v=>{const vb=mk('button');vb.textContent=v.label;vb.onclick=()=>{S.stVoice=v.id;vRow.querySelectorAll('button').forEach(b=>Object.assign(b.style,{background:'var(--cs)',color:'var(--ts)',border:BD,fontWeight:'400'}));Object.assign(vb.style,{background:'var(--ci)',color:'var(--ti)',border:'.5px solid var(--bi)',fontWeight:'600'})};Object.assign(vb.style,{padding:'3px 7px',fontSize:'10px',border:S.stVoice===v.id?'.5px solid var(--bi)':BD,borderRadius:R,cursor:'pointer',background:S.stVoice===v.id?'var(--ci)':'var(--cs)',color:S.stVoice===v.id?'var(--ti)':'var(--ts)',fontWeight:S.stVoice===v.id?'600':'400'});vRow.appendChild(vb)});pop.appendChild(vRow);
      const guide=mk('div',{style:{fontSize:'10px',color:'var(--tt)',lineHeight:'1.75',padding:'8px 10px',background:'var(--cs)',borderRadius:R}});
      guide.innerHTML=`<b style="color:var(--ts)">로컬 실행 방법</b><br><code style="font-size:10px;color:var(--ti)">supertonic serve --port 8000</code><br><code style="font-size:10px;color:var(--ti)">python -m http.server 3000</code><br>→ <code style="font-size:10px;color:var(--ti)">http://localhost:3000</code> 으로 열기<br><span style="font-size:9px;color:var(--bi)">미연결 시 브라우저 TTS로 자동 대체</span>`;
      pop.appendChild(guide);ftR.appendChild(pop);
      setTimeout(()=>{const cl=e=>{if(!pop.contains(e.target)&&e.target!==cfgBtn){set({stShowCfg:false});document.removeEventListener('click',cl)}};document.addEventListener('click',cl)},100);
    }
    ftR.append(cfgBtn,spBtn);ft.append(ftL,ftR);p3.appendChild(ft);
  }

  // P4 숫자
  const p4=mk('div',{style:{width:'140px',borderLeft:BD,display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--cs)',flexShrink:'0'}});
  p4.appendChild(lbl('숫자 목록'));
  const p4l=mk('div',{id:'nlist',style:{overflow:'auto',flex:'1',padding:'5px'}});
  if(!ce)p4l.appendChild(mk('div',{innerHTML:'에피소드 선택 후<br>표시',style:{fontSize:'10px',color:'var(--tt)',textAlign:'center',padding:'20px 8px',lineHeight:'1.8'}}));
  p4.appendChild(p4l);

  pnls.append(p1,p2,p3,p4);
  wrap.appendChild(pnls);
  app.appendChild(wrap);

  requestAnimationFrame(()=>{
    if(editorEl&&ce){editorEl.innerText=S.body;const nl=g('nlist');if(nl)bldNums(nl)}
  });
}

function render(){
  if(S.page==='main')renderMain();
  else renderEditor();
}

if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>{}}
const ws=stG(WK)||[];set({works:ws});
</script>
</body>
